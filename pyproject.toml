[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "fast-molecular-dynamics"
version = "0.2.0"
description = "GPU-accelerated molecular dynamics simulator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["molecular-dynamics", "cuda", "gpu", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/Chenghao-Wu/fastMD"

[tool.scikit-build]
cmake.build-type = "Release"
# Tests are not built for wheels (FASTMD_BUILD_TESTS defaults OFF under
# scikit-build). Select GPU architectures with e.g.
#   pip install . -Ccmake.define.CMAKE_CUDA_ARCHITECTURES=86
wheel.packages = ["python/fastmd"]
