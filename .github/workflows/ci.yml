name: CI

# GitHub-hosted runners have no GPU: this builds everything (command-line
# program, unit tests, Python extension) against two CUDA toolkits and runs
# the CPU-labelled tests. GPU tests run with `ctest -L gpu` on a GPU machine.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: CUDA ${{ matrix.cuda }}
    runs-on: ubuntu-22.04
    container: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        cuda: ["11.8.0", "12.4.1"]
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake git g++ make python3 python3-dev python3-pip
          python3 -m pip install --no-cache-dir pybind11 numpy

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DFASTMD_BUILD_TESTS=ON -DFASTMD_BUILD_PYTHON=ON \
            -DPython_EXECUTABLE=$(command -v python3) \
            -Dpybind11_DIR=$(python3 -m pybind11 --cmakedir)

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: CPU tests
        run: ctest --test-dir build -L cpu --output-on-failure

      - name: Python sources compile
        run: python3 -m compileall -q benchmarks tools python tests/python
